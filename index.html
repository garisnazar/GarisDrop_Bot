<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GarisDrop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }

  :root{
    --neon:#00ff9d;
    --bg:#000;
    --card:#0a1410;
    --card2:#0f1f18;
    --border:rgba(0,255,157,.18);
    --text:#e6fff5;
    --muted:#5f8a78;
    --red:#ff4d6d;
    --yellow:#ffd700;
  }

  html,body{ height:100%; background:var(--bg); color:var(--text); overflow:hidden; }

  /* ===== ФОН ===== */
  #bg{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(0,255,157,.10), transparent 42%),
      radial-gradient(circle at 85% 75%, rgba(92,191,74,.08), transparent 45%),
      #000;
  }
  #bg::before{
    content:""; position:absolute; inset:-50%;
    background-image:radial-gradient(var(--neon) 1.6px, transparent 1.6px);
    background-size:38px 38px; opacity:.28; animation: drift 24s linear infinite;
  }
  #bg::after{
    content:""; position:absolute; inset:-50%;
    background-image:radial-gradient(var(--neon) 1.2px, transparent 1.2px);
    background-size:22px 22px; opacity:.12; animation: drift2 40s linear infinite reverse;
  }
  @keyframes drift{ to{ transform:translate(38px,38px);} }
  @keyframes drift2{ to{ transform:translate(-22px,22px);} }

  /* ===== NFT Pepe ===== */
  .nft-float{
    position:absolute; width:88px; height:108px; border-radius:16px;
    background:linear-gradient(160deg, rgba(12,32,24,.9), rgba(5,15,10,.9));
    border:1px solid rgba(0,255,157,.35); box-shadow:0 0 24px rgba(0,255,157,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; backdrop-filter:blur(4px); animation: floatY 9s ease-in-out infinite;
    opacity:.5; pointer-events:none;
  }
  .nft-float .pepe{
    width:52px; height:52px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:radial-gradient(circle at 35% 30%, #7de86a, #2f7d24 70%, #1a4a14);
    box-shadow:0 0 16px rgba(0,255,157,.45); font-size:28px;
  }
  .nft-1{ top:8%; left:-18px; transform:rotate(-12deg); }
  .nft-2{ top:38%; right:-22px; transform:rotate(14deg); animation-delay:-2.5s; }
  .nft-3{ top:66%; left:-14px; transform:rotate(-8deg); animation-delay:-5s; }
  @keyframes floatY{ 0%,100%{ translate:0 0; } 50%{ translate:0 -18px; } }

  /* ===== APP ===== */
  #app{
    position:relative; z-index:1; height:100%; display:flex; flex-direction:column;
    padding:16px 16px calc(92px + env(safe-area-inset-bottom)); overflow:hidden;
  }

  .header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .logo{ font-weight:900; font-size:19px; background:linear-gradient(90deg,#00ff9d,#5cbf4a,#00ff9d); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .header-right{ display:flex; align-items:center; gap:8px; }
  .balance-pill{
    background:var(--card); border:1px solid var(--border); padding:8px 12px; border-radius:999px;
    font-size:14px; font-weight:800; color:var(--neon); display:flex; align-items:center; gap:6px; transition: transform 0.1s;
  }
  .deposit-btn-top{ background:linear-gradient(135deg,#00ff9d,#5cbf4a); border:none; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:900; color:#001a10; cursor:pointer; }

  /* ===== PAGES ===== */
  /* Убрали анимацию, которая скрывала контент, добавили min-height: 0 */
  .page{ flex:1; min-height: 0; overflow-y:auto; display:none; padding-bottom:12px; color: var(--text); }
  .page.active{ display:block; }
  
  .title{ font-size:22px; font-weight:900; margin-bottom:14px; }
  .title span{ color:var(--neon); }

  /* ===== GAMES ===== */
  .games-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .game-card{
    position:relative; background:var(--card2); border:1px solid var(--border);
    border-radius:22px; padding:18px 14px; display:flex; flex-direction:column;
    align-items:center; gap:10px; cursor:pointer; transition: transform 0.1s;
  }
  .game-card:active{ transform:scale(.96); }
  .game-card .emoji{ font-size:34px; }
  .game-card .name{ font-size:14px; font-weight:800; }
  .game-card .tag{ font-size:10px; color:var(--muted); }
  .game-card.coming{ opacity:.42; cursor:default; border-style:dashed; justify-content:center; min-height:110px; }
  .game-card .nft-badge{ position:absolute; top:8px; right:8px; font-size:8px; font-weight:900; padding:3px 7px; border-radius:999px; background:var(--neon); color:#001a10; }

  /* ===== SLOTS ===== */
  .game-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  
  .mode-selector { display: flex; gap: 6px; width: 100%; max-width: 400px; margin-bottom: 4px; z-index: 10; }
  .mode-btn {
    flex: 1; padding: 10px 0; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .mode-btn.active { background: rgba(0, 255, 157, 0.15); color: var(--neon); border-color: var(--neon); box-shadow: 0 0 10px rgba(0,255,157,0.2); }

  .slots-wrapper { position: relative; width: 100%; max-width: 400px; padding: 0 20px; }
  .slots{
    display:grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap:8px;
    width:100%; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:14px;
    box-shadow: 0 0 30px rgba(0,255,157,0.05); position: relative; overflow: hidden;
  }
  .slots::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 33.33%; background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent); pointer-events: none; z-index: 2; border-radius: 24px 24px 0 0; }
  .slots::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 33.33%; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent); pointer-events: none; z-index: 2; border-radius: 0 0 24px 24px; }

  .win-line-top, .win-line-bottom { position: absolute; left: 10px; right: 10px; height: 2px; background: rgba(255, 77, 109, 0.6); box-shadow: 0 0 10px rgba(255, 77, 109, 0.8); z-index: 3; pointer-events: none; }
  .win-line-top { top: 33.33%; transform: translateY(-50%); }
  .win-line-bottom { top: 66.66%; transform: translateY(-50%); }

  .red-arrow { position: absolute; top: 50%; transform: translateY(-50%); color: var(--red); font-size: 24px; z-index: 5; text-shadow: 0 0 15px rgba(255, 77, 109, 0.9); animation: pulseArrow 1s infinite alternate; pointer-events: none; }
  .red-arrow.left { left: -4px; }
  .red-arrow.right { right: -4px; }
  @keyframes pulseArrow { from { opacity: 0.6; transform: translateY(-50%) scale(0.9); } to { opacity: 1; transform: translateY(-50%) scale(1.1); } }

  .cell{
    aspect-ratio:1; border-radius:12px; background:#0d1f18; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size: clamp(20px, 6vw, 32px);
    transition: all 0.2s; position: relative; z-index: 1;
  }
  .cell.spinning { animation: blurSpin 0.1s linear infinite; }
  @keyframes blurSpin { 0% { transform: translateY(-5px); opacity: 0.7; } 100% { transform: translateY(5px); opacity: 1; } }
  .cell.win{ border-color:var(--neon); box-shadow: 0 0 20px rgba(0,255,157,0.8), inset 0 0 10px rgba(0,255,157,0.4); background: rgba(0,255,157,0.1); transform: scale(1.05); z-index: 4; }

  /* ===== MINES ===== */
  .mines-grid-wrap { position: relative; width: 100%; max-width: 340px; margin: 0 auto; }
  .mines-grid {
    display: grid; gap: 8px; padding: 12px; background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; box-shadow: 0 0 30px rgba(0,255,157,0.05); width: 100%; aspect-ratio: 1;
  }
  .mine-cell {
    background: #0d1f18; border: 1px solid var(--border); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    cursor: pointer; transition: all 0.2s; user-select: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  .mine-cell:active { transform: scale(0.95); }
  .mine-cell.gem { background: rgba(0,255,157,0.1); border-color: var(--neon); box-shadow: 0 0 15px rgba(0,255,157,0.6), inset 0 0 10px rgba(0,255,157,0.3); animation: popGem 0.3s ease; }
  .mine-cell.bomb { background: rgba(255,77,109,0.2); border-color: var(--red); box-shadow: 0 0 15px rgba(255,77,109,0.8), inset 0 0 10px rgba(255,77,109,0.5); animation: shake 0.4s ease; }
  @keyframes popGem { 0% { transform: scale(0.5); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .cashout-btn {
    width: 100%; padding: 16px; border-radius: 20px; font-size: 17px; font-weight: 900;
    color: #001a10; background: linear-gradient(135deg, #00ff9d, #5cbf4a);
    border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 5px 15px rgba(0,255,157,0.3);
    display: none; margin-top: 10px;
  }
  .cashout-btn.show { display: block; }
  .cashout-btn:active { transform: scale(0.97); }

  /* Блок ввода ставки */
  .bet-row{ display:flex; align-items:center; gap:10px; margin-top: 10px; z-index: 10; justify-content: center; width: 100%; }
  .bet-btn{
    width:44px; height:44px; border-radius:14px; background:var(--card);
    border:1px solid var(--border); color:var(--neon); font-size:20px; font-weight:800;
    cursor:pointer; transition: transform 0.1s;
  }
  .bet-btn:active{ transform:scale(0.9); }
  .bet-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  
  .bet-input-wrap {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:0 10px; display:flex; align-items:center; height:44px;
  }
  .bet-input-wrap span { color:var(--muted); font-size:14px; margin-right:5px; }
  .bet-input-wrap input {
    width: 60px; background: transparent; border: none; outline: none;
    color: var(--neon); font-size: 16px; font-weight: 800; text-align: center;
  }
  .bet-input-wrap input:disabled { opacity: 0.5; }

  .main-action-btn{
    width:100%; max-width:340px; padding:16px; border:none; border-radius:20px;
    font-size:17px; font-weight:900; color:#001a10; background:linear-gradient(135deg,#00ff9d,#5cbf4a);
    cursor:pointer; transition: all 0.2s; box-shadow: 0 5px 15px rgba(0,255,157,0.3); margin-top: 10px;
  }
  .main-action-btn:active{ transform:scale(.97); }
  .main-action-btn:disabled{ opacity:.5; box-shadow:none; cursor:not-allowed; }

  /* ===== PROFILE ===== */
  .profile-card{ background:var(--card2); border:1px solid var(--border); border-radius:24px; padding:22px; text-align:center; margin-bottom:14px; }
  .avatar{ width:78px; height:78px; border-radius:50%; margin:0 auto 12px; background:radial-gradient(circle, #7de86a, #2f7d24); display:flex; align-items:center; justify-content:center; font-size:36px; }
  .profile-name{ font-size:18px; font-weight:900; }
  .profile-id{ font-size:12px; color:var(--muted); }
  .profile-balance{ font-size:34px; font-weight:900; color:var(--neon); margin-top:16px; }
  .action-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .action-btn{ padding:18px; border-radius:20px; border:1px solid var(--border); background:var(--card2); color:white; font-weight:800; cursor:pointer; }
  .info-block{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:12px; }
  .info-block h4{ font-size:13px; color:var(--neon); margin-bottom:8px; }
  .info-block p{ font-size:12px; color:var(--muted); line-height:1.5; }

  /* ===== NAV ===== */
  .nav{ position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); background:rgba(8,20,16,.85); border:1px solid var(--border); border-radius:24px; display:flex; padding:8px; z-index:10; backdrop-filter: blur(10px); }
  .nav-btn{ flex:1; padding:12px; border-radius:18px; border:none; background:transparent; color:var(--muted); font-weight:800; cursor:pointer; transition: all 0.2s; }
  .nav-btn.active{ background:rgba(0,255,157,.15); color:var(--neon); }

  /* ===== МОДАЛЬНЫЕ ОКНА ===== */
  .modal-mask{ position:fixed; inset:0; z-index:50; display:none; background:rgba(0,0,0,.7); align-items:center; justify-content:center; backdrop-filter: blur(5px); }
  .modal-mask.show{ display:flex; }
  .modal{ width:90%; max-width:340px; background:var(--card2); border-radius:28px; padding:30px 20px; position:relative; text-align:center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: popIn 0.3s; }
  @keyframes popIn { from { transform: scale(0.9); } to { transform: scale(1); } }

  .modal.lose { border: 1px solid rgba(255, 77, 109, 0.4); box-shadow: 0 0 30px rgba(255, 77, 109, 0.15); }
  .icon-lose { font-size: 50px; color: var(--red); margin-bottom: 15px; text-shadow: 0 0 15px rgba(255,77,109,0.5); }
  .modal.lose h3 { color: var(--red); margin-bottom: 10px; font-size: 20px; }
  .modal.lose p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .modal.win { border: 1px solid rgba(0, 255, 157, 0.5); box-shadow: 0 0 30px rgba(0, 255, 157, 0.2); }
  .icon-win { font-size: 50px; color: var(--neon); margin-bottom: 15px; text-shadow: 0 0 15px rgba(0,255,157,0.6); }
  .modal.win h3 { color: var(--neon); margin-bottom: 10px; font-size: 20px; }
  .modal.win p { color: white; font-size: 15px; margin-bottom: 20px; }
  .win-amount { font-size: 24px; font-weight: 900; color: var(--neon); display: block; margin-top: 10px; }

  .modal-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 900; font-size: 15px; cursor: pointer; transition: transform 0.1s; }
  .modal-btn:active { transform: scale(0.95); }
  .modal-btn.red { background: rgba(255,77,109,0.15); color: var(--red); }
  .modal-btn.green { background: var(--neon); color: #001a10; box-shadow: 0 0 15px rgba(0,255,157,0.4); }
</style>
</head>
<body>

<div id="bg">
  <div class="nft-float nft-1"><div class="pepe">🐸</div><div class="tag">PEPE</div><div class="id">#0421</div></div>
  <div class="nft-float nft-2"><div class="pepe">🐸</div><div class="tag">PEPE</div><div class="id">#1337</div></div>
  <div class="nft-float nft-3"><div class="pepe">🐸</div><div class="tag">PEPE</div><div class="id">#7777</div></div>
</div>

<div id="app">
  <div class="header">
    <div class="logo">🐸 GARISDROP</div>
    <div class="header-right">
      <button class="deposit-btn-top" onclick="openModal('deposit')">+ Пополнить</button>
      <div class="balance-pill" id="balanceTopWrap">⭐ <span id="balanceTop">0</span></div>
    </div>
  </div>

  <!-- ГЛАВНОЕ МЕНЮ ИГР -->
  <div class="page active" id="page-games">
    <div class="title">Игры <span>▸</span></div>
    <div class="games-grid">
      <!-- Слоты -->
      <div class="game-card" onclick="openGame('slots')">
        <div class="nft-badge">HOT</div>
        <div class="emoji">🍌🎰</div>
        <div class="name">Слоты</div>
        <div class="tag">3 режима</div>
      </div>
      <!-- Минер (Новинка!) -->
      <div class="game-card" onclick="openGame('mines')">
        <div class="nft-badge" style="background:var(--yellow); color:#000; box-shadow: 0 0 10px rgba(255,215,0,0.6);">NEW</div>
        <div class="emoji">💣💎</div>
        <div class="name">Минер</div>
        <div class="tag">Играй и забирай</div>
      </div>
      
      <div class="game-card coming"><div class="emoji">🎲</div><div class="name">Скоро</div></div>
      <div class="game-card coming"><div class="emoji">🃏</div><div class="name">Скоро</div></div>
    </div>
  </div>

  <!-- ИГРА СЛОТЫ -->
  <div class="page" id="page-slots">
    <div class="title" onclick="switchPage('games')" style="cursor:pointer; font-size:16px; margin-bottom:10px;">← Назад</div>
    <div class="game-wrap">
      <div class="mode-selector">
        <button class="mode-btn active" id="btn-slot-easy" onclick="setSlotMode('easy')">Легкий (x1.5)</button>
        <button class="mode-btn" id="btn-slot-medium" onclick="setSlotMode('medium')">Средний (x2)</button>
        <button class="mode-btn" id="btn-slot-hard" onclick="setSlotMode('hard')">Сложный (x4)</button>
      </div>

      <div class="slots-wrapper">
        <div class="win-line-top"></div>
        <div class="win-line-bottom"></div>
        <div class="red-arrow left">▶</div>
        <div class="red-arrow right">◀</div>
        <div class="slots" id="slots"></div>
      </div>
      
      <div class="bet-row">
        <button class="bet-btn" id="slot-betMinus" onclick="changeSlotBet(-10)">−</button>
        <div class="bet-input-wrap">
          <span>Ставка:</span>
          <input type="number" id="slot-betInput" value="10" min="10" max="10000" onchange="validateSlotBetInput()">
        </div>
        <button class="bet-btn" id="slot-betPlus" onclick="changeSlotBet(10)">+</button>
      </div>
      
      <button class="main-action-btn" id="spinBtn" onclick="spinSlots()">КРУТИТЬ 🎰</button>
    </div>
  </div>

  <!-- ИГРА МИНЕР -->
  <div class="page" id="page-mines">
    <div class="title" onclick="switchPage('games')" style="cursor:pointer; font-size:16px; margin-bottom:10px;">← Назад</div>
    <div class="game-wrap">
      <div class="mode-selector">
        <button class="mode-btn active" id="btn-mine-easy" onclick="setMineMode('easy')">Легкий 3x3</button>
        <button class="mode-btn" id="btn-mine-medium" onclick="setMineMode('medium')">Средний 4x4</button>
        <button class="mode-btn" id="btn-mine-hard" onclick="setMineMode('hard')">Сложный 5x5</button>
      </div>

      <div class="mines-grid-wrap">
        <div class="mines-grid" id="minesGrid"></div>
      </div>

      <div class="bet-row" id="minesBetPanel">
        <button class="bet-btn" id="mine-betMinus" onclick="changeMineBet(-10)">−</button>
        <div class="bet-input-wrap">
          <span>Ставка:</span>
          <input type="number" id="mine-betInput" value="10" min="10" max="10000" onchange="validateMineBetInput()">
        </div>
        <button class="bet-btn" id="mine-betPlus" onclick="changeMineBet(10)">+</button>
      </div>
      
      <button class="main-action-btn" id="mineStartBtn" onclick="startMines()">НАЧАТЬ ИГРУ 💣</button>
      <button class="cashout-btn" id="mineCashoutBtn" onclick="cashoutMines()">ЗАБРАТЬ: <span id="cashoutAmount">0</span> ⭐</button>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div class="page" id="page-profile">
    <div class="title">Профиль <span>▸</span></div>
    <div class="profile-card">
      <div class="avatar">🐸</div>
      <div class="profile-name" id="userName">Игрок</div>
      <div class="profile-id" id="userId">ID: —</div>
      <div class="profile-balance"><small>⭐</small> <span id="balanceProfile">0</span></div>
    </div>
    <div class="action-row">
      <button class="action-btn" onclick="openModal('deposit')">＋ Пополнить</button>
      <button class="action-btn" onclick="openModal('withdraw')">↗ Вывести</button>
    </div>
    <div class="info-block"><h4>💳 Карта</h4><p>Мин. <b>1100 ₽</b>, комиссия <b>5%</b>.</p></div>
    <div class="info-block"><h4>⭐ Звезды</h4><p>Мин. <b>500 ⭐</b>, сумма кратна <b>100</b>.</p></div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" id="nav-games" onclick="switchPage('games')">🎮 Игры</button>
  <button class="nav-btn" id="nav-profile" onclick="switchPage('profile')">👤 Профиль</button>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <div id="modalIcon"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button class="modal-btn" id="modalBtn" onclick="closeModal()"></button>
  </div>
</div>

<script>
const STATE = { balance: 1000 };
const SYMBOLS = ['🍌','🎰','💎','🍒','⭐'];

if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  if (Telegram.WebApp.initDataUnsafe?.user) {
    document.getElementById('userName').textContent = Telegram.WebApp.initDataUnsafe.user.first_name;
    document.getElementById('userId').textContent = 'ID: ' + Telegram.WebApp.initDataUnsafe.user.id;
  }
}

function updateUI() {
  document.getElementById('balanceTop').textContent = STATE.balance;
  document.getElementById('balanceProfile').textContent = STATE.balance;
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if(name === 'games' || name === 'profile') document.getElementById('nav-' + name).classList.add('active');
  else document.getElementById('nav-games').classList.add('active');
}

// ИСПРАВЛЕНА ОШИБКА ЗДЕСЬ (было game + 's')
function openGame(game) {
  switchPage(game); 
  if (game === 'slots') setSlotMode(slotState.mode);
  if (game === 'mines') resetMinesBoard();
}

/* ================= СЛОТЫ ================= */
const SLOT_MODES = {
  easy: { cols: 3, mult: 1.5, winChance: 0.20, nearMissChance: 0.50 },
  medium: { cols: 4, mult: 2.0, winChance: 0.08, nearMissChance: 0.50 },
  hard: { cols: 5, mult: 4.0, winChance: 0.03, nearMissChance: 0.50 }
};
let slotState = { mode: 'easy', bet: 10, spinning: false };

function setSlotMode(mode) {
  if (slotState.spinning) return;
  slotState.mode = mode;
  
  document.querySelectorAll('[id^="btn-slot-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-slot-' + mode).classList.add('active');
  
  const cols = SLOT_MODES[mode].cols;
  const slotsContainer = document.getElementById('slots');
  slotsContainer.style.setProperty('--cols', cols);
  slotsContainer.innerHTML = '';
  
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < cols; col++) {
      let cell = document.createElement('div');
      cell.className = 'cell'; cell.dataset.col = col; cell.dataset.row = row;
      cell.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      slotsContainer.appendChild(cell);
    }
  }
}

function updateSlotUI() { document.getElementById('slot-betInput').value = slotState.bet; }
function changeSlotBet(d) { if (slotState.spinning) return; let nb = slotState.bet + d; if (nb >= 10 && nb <= STATE.balance) { slotState.bet = nb; updateSlotUI(); } }
function validateSlotBetInput() { if (slotState.spinning) return; let val = parseInt(document.getElementById('slot-betInput').value) || 10; if (val < 10) val = 10; if (val > STATE.balance) val = STATE.balance; slotState.bet = val; updateSlotUI(); }

function lockSlotControls(isLocked) {
  slotState.spinning = isLocked;
  document.getElementById('spinBtn').disabled = isLocked;
  document.getElementById('slot-betInput').disabled = isLocked;
  document.getElementById('slot-betPlus').disabled = isLocked;
  document.getElementById('slot-betMinus').disabled = isLocked;
  document.querySelectorAll('[id^="btn-slot-"]').forEach(b => b.disabled = isLocked);
}

function spinSlots() {
  if (slotState.spinning || STATE.balance < slotState.bet) return;
  const mode = SLOT_MODES[slotState.mode];
  STATE.balance -= slotState.bet; updateUI(); lockSlotControls(true);
  
  const cells = document.querySelectorAll('#slots .cell');
  cells.forEach(c => c.classList.remove('win'));

  let grid = []; 
  let isWin = Math.random() < mode.winChance;
  let isNearMiss = !isWin && Math.random() < mode.nearMissChance;
  for(let i=0; i < 3 * mode.cols; i++) grid.push(null);
  const WIN_LINE = 1;

  if (isWin) {
    const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    for(let c=0; c < mode.cols; c++) grid[WIN_LINE * mode.cols + c] = sym;
  } else if (isNearMiss) {
    const cols = mode.cols;
    const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    const matchLen = Math.floor(Math.random() * (cols - 2 + 1)) + 2; 
    const startIdx = Math.floor(Math.random() * (cols - matchLen + 1));
    
    for (let i = 0; i < matchLen; i++) grid[WIN_LINE * cols + startIdx + i] = sym;
    for (let c = 0; c < cols; c++) {
       if (grid[WIN_LINE * cols + c] === null) {
          let failSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
          while (failSym === sym) failSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
          grid[WIN_LINE * cols + c] = failSym;
       }
    }
  }

  for (let i = 0; i < grid.length; i++) { if (!grid[i]) grid[i] = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]; }
  if (!isWin) {
      let fullMatch = true; let firstSym = grid[WIN_LINE * mode.cols];
      for (let c = 1; c < mode.cols; c++) { if (grid[WIN_LINE * mode.cols + c] !== firstSym) { fullMatch = false; break; } }
      if (fullMatch) grid[WIN_LINE * mode.cols + (mode.cols - 1)] = SYMBOLS[(SYMBOLS.indexOf(firstSym)+1)%SYMBOLS.length];
  }

  const spinIntervals = [];
  for (let col = 0; col < mode.cols; col++) {
    const colCells = Array.from(cells).filter(c => parseInt(c.dataset.col) === col);
    colCells.forEach(c => c.classList.add('spinning'));
    spinIntervals[col] = setInterval(() => { colCells.forEach(c => c.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]); }, 60);
  }

  for (let col = 0; col < mode.cols; col++) {
    setTimeout(() => {
      clearInterval(spinIntervals[col]);
      const colCells = Array.from(cells).filter(c => parseInt(c.dataset.col) === col);
      colCells.forEach((c, rowIndex) => {
        c.classList.remove('spinning');
        c.textContent = grid[rowIndex * mode.cols + col];
      });

      if (col === mode.cols - 1) {
        setTimeout(() => {
          if (isWin) {
            const winAmount = Math.floor(slotState.bet * mode.mult);
            STATE.balance += winAmount; updateUI();
            for(let c=0; c<mode.cols; c++) cells[WIN_LINE * mode.cols + c].classList.add('win');
            showWinModal(winAmount, mode.mult);
          } else {
            showLoseModal(isNearMiss);
          }
          lockSlotControls(false);
        }, 300); 
      }
    }, 800 + col * 500);
  }
}

/* ================= МИНЕР ================= */
const MINE_MODES = {
  easy: { size: 3, mines: 1, maxMult: 5.0 },
  medium: { size: 4, mines: 3, maxMult: 15.0 },
  hard: { size: 5, mines: 5, maxMult: 50.0 }
};
let mineState = { mode: 'easy', bet: 10, active: false, grid: [], opened: 0, safeCount: 0, currentMult: 1.0 };

function setMineMode(mode) {
  if (mineState.active) return;
  mineState.mode = mode;
  document.querySelectorAll('[id^="btn-mine-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-mine-' + mode).classList.add('active');
  resetMinesBoard();
}

function resetMinesBoard() {
  const mode = MINE_MODES[mineState.mode];
  const grid = document.getElementById('minesGrid');
  grid.style.gridTemplateColumns = `repeat(${mode.size}, 1fr)`;
  grid.innerHTML = '';
  
  mineState.active = false;
  mineState.grid = [];
  mineState.opened = 0;
  mineState.currentMult = 1.0;
  
  document.getElementById('minesBetPanel').style.display = 'flex';
  document.getElementById('mineStartBtn').style.display = 'block';
  document.getElementById('mineCashoutBtn').classList.remove('show');

  const totalCells = mode.size * mode.size;
  for (let i = 0; i < totalCells; i++) {
    let cell = document.createElement('div');
    cell.className = 'mine-cell';
    cell.dataset.index = i;
    cell.onclick = () => clickMineCell(i);
    grid.appendChild(cell);
    mineState.grid.push({ isMine: false, isOpened: false, el: cell });
  }
}

function updateMineUI() { document.getElementById('mine-betInput').value = mineState.bet; }
function changeMineBet(d) { if (mineState.active) return; let nb = mineState.bet + d; if (nb >= 10 && nb <= STATE.balance) { mineState.bet = nb; updateMineUI(); } }
function validateMineBetInput() { if (mineState.active) return; let val = parseInt(document.getElementById('mine-betInput').value) || 10; if (val < 10) val = 10; if (val > STATE.balance) val = STATE.balance; mineState.bet = val; updateMineUI(); }

function startMines() {
  if (mineState.active || STATE.balance < mineState.bet) return;
  
  const mode = MINE_MODES[mineState.mode];
  STATE.balance -= mineState.bet;
  updateUI();
  mineState.active = true;
  
  document.getElementById('minesBetPanel').style.display = 'none';
  document.getElementById('mineStartBtn').style.display = 'none';
  document.getElementById('mineCashoutBtn').classList.add('show');
  updateCashoutBtn();

  const totalCells = mode.size * mode.size;
  let minesPlaced = 0;
  while (minesPlaced < mode.mines) {
    let rIdx = Math.floor(Math.random() * totalCells);
    if (!mineState.grid[rIdx].isMine) {
      mineState.grid[rIdx].isMine = true;
      minesPlaced++;
    }
  }
}

function updateCashoutBtn() {
  const amount = Math.floor(mineState.bet * mineState.currentMult);
  document.getElementById('cashoutAmount').textContent = amount;
}

function getMineMultiplier(opened, size, mines) {
  if (opened === 0) return 1.0;
  let mult = 1.0;
  for (let i = 0; i < opened; i++) { mult += (i * 0.2) + 0.3; }
  return Math.min(mult, MINE_MODES[mineState.mode].maxMult);
}

function clickMineCell(index) {
  if (!mineState.active) return;
  const cellData = mineState.grid[index];
  if (cellData.isOpened) return;
  
  cellData.isOpened = true;
  const mode = MINE_MODES[mineState.mode];
  
  if (cellData.isMine) {
    cellData.el.classList.add('bomb');
    cellData.el.textContent = '💣';
    mineState.active = false;
    
    mineState.grid.forEach(c => {
      if (c.isMine && !c.isOpened) {
        c.el.classList.add('bomb');
        c.el.textContent = '💣';
        c.el.style.opacity = '0.5';
      }
    });

    setTimeout(() => {
      document.getElementById('mineCashoutBtn').classList.remove('show');
      document.getElementById('mineStartBtn').style.display = 'block';
      document.getElementById('minesBetPanel').style.display = 'flex';
      showLoseModal(false, 'Вы наткнулись на мину!');
      resetMinesBoard();
    }, 1000);

  } else {
    cellData.el.classList.add('gem');
    cellData.el.textContent = '⭐';
    mineState.opened++;
    
    mineState.currentMult = getMineMultiplier(mineState.opened, mode.size, mode.mines);
    updateCashoutBtn();

    if (mineState.opened === (mode.size * mode.size - mode.mines)) {
      cashoutMines();
    }
  }
}

function cashoutMines() {
  if (!mineState.active || mineState.opened === 0) return;
  
  const winAmount = Math.floor(mineState.bet * mineState.currentMult);
  STATE.balance += winAmount;
  updateUI();
  mineState.active = false;
  
  document.getElementById('mineCashoutBtn').classList.remove('show');
  document.getElementById('mineStartBtn').style.display = 'block';
  document.getElementById('minesBetPanel').style.display = 'flex';
  
  showWinModal(winAmount, mineState.currentMult.toFixed(1));
  resetMinesBoard();
}

/* ================= МОДАЛКИ ================= */
function openModal(type) {
  const mask = document.getElementById('modalMask');
  const box = document.getElementById('modalBox');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const text = document.getElementById('modalText');
  const btn = document.getElementById('modalBtn');

  if (type === 'deposit') {
    box.className = 'modal'; icon.className = ''; icon.innerHTML = '';
    title.textContent = 'Пополнение';
    text.innerHTML = 'Функция пополнения скоро будет доступна!';
    btn.className = 'modal-btn green'; btn.textContent = 'ОК';
  } else if (type === 'withdraw') {
    box.className = 'modal'; icon.className = ''; icon.innerHTML = '';
    title.textContent = 'Вывод';
    text.innerHTML = 'Вывод на карту: мин. 1100₽ (5%)<br>Вывод звезд: мин. 500⭐ (кратно 100)';
    btn.className = 'modal-btn green'; btn.textContent = 'Понятно';
  }
  mask.classList.add('show');
}

function showLoseModal(isNearMiss, customText = '') {
  const box = document.getElementById('modalBox');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const text = document.getElementById('modalText');
  const btn = document.getElementById('modalBtn');
  
  box.className = 'modal lose';
  icon.className = 'icon-lose'; icon.innerHTML = '✕';
  
  if (customText) {
    title.textContent = 'Бум! 💥';
    text.innerHTML = customText;
  } else if (isNearMiss) {
    title.textContent = 'Ух, почти!';
    text.innerHTML = `На центральной линии не хватило всего одного символа!<br>Попробуйте еще раз!`;
  } else {
    title.textContent = 'Очень жаль...';
    text.innerHTML = 'В этот раз не повезло.<br>Попробуйте еще раз!';
  }
  
  btn.className = 'modal-btn red'; btn.textContent = 'Ближе к делу';
  document.getElementById('modalMask').classList.add('show');
}

function showWinModal(amount, mult) {
  const box = document.getElementById('modalBox');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const text = document.getElementById('modalText');
  const btn = document.getElementById('modalBtn');
  
  box.className = 'modal win';
  icon.className = 'icon-win'; icon.innerHTML = '★';
  title.textContent = 'Поздравляем!';
  text.innerHTML = `Вы забрали выигрыш (x${mult})!<span class="win-amount">+${amount} ⭐</span>`;
  btn.className = 'modal-btn green'; btn.textContent = 'Забрать';
  document.getElementById('modalMask').classList.add('show');
}

function closeModal() {
  document.getElementById('modalMask').classList.remove('show');
}

// Инициализация
updateUI();
setSlotMode('easy');
</script>
