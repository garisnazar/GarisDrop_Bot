<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GarisDrop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }

  :root{
    --neon:#00ff9d;
    --neon2:#3dffb0;
    --neon-dim:#00c97a;
    --pepe:#5cbf4a;
    --bg:#000;
    --card:#0a1410;
    --card2:#0f1f18;
    --border:rgba(0,255,157,.18);
    --text:#e6fff5;
    --muted:#5f8a78;
  }

  html,body{ height:100%; background:var(--bg); color:var(--text); overflow:hidden; }

  /* ФОН */
  #bg{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(0,255,157,.10), transparent 42%),
      radial-gradient(circle at 85% 75%, rgba(92,191,74,.08), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(0,255,157,.03), transparent 70%),
      #000;
  }
  #bg::before{
    content:""; position:absolute; inset:-50%;
    background-image:radial-gradient(var(--neon) 1.6px, transparent 1.6px);
    background-size:38px 38px;
    opacity:.28;
    animation: drift 24s linear infinite;
  }
  #bg::after{
    content:""; position:absolute; inset:-50%;
    background-image:radial-gradient(var(--neon) 1.2px, transparent 1.2px);
    background-size:22px 22px;
    opacity:.12;
    animation: drift2 40s linear infinite reverse;
  }
  @keyframes drift{ to{ transform:translate(38px,38px);} }
  @keyframes drift2{ to{ transform:translate(-22px,22px);} }

  /* NFT Pepe */
  .nft-float{
    position:absolute;
    width:88px; height:108px;
    border-radius:16px;
    background:linear-gradient(160deg, rgba(12,32,24,.9), rgba(5,15,10,.9));
    border:1px solid rgba(0,255,157,.35);
    box-shadow:0 0 24px rgba(0,255,157,.25), inset 0 0 18px rgba(0,255,157,.08);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:4px; backdrop-filter:blur(4px);
    animation: floatY 9s ease-in-out infinite;
    opacity:.5; pointer-events:none;
  }
  .nft-float .pepe{
    width:52px; height:52px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #7de86a, #2f7d24 70%, #1a4a14);
    box-shadow:0 0 16px rgba(0,255,157,.45), inset 0 -4px 8px rgba(0,0,0,.4);
    font-size:28px;
  }
  .nft-float .tag{ font-size:8px; font-weight:800; color:var(--neon); }
  .nft-float .id{ font-size:7px; color:var(--muted); }

  .nft-1{ top:8%; left:-18px; transform:rotate(-12deg); }
  .nft-2{ top:38%; right:-22px; transform:rotate(14deg); animation-delay:-2.5s; }
  .nft-3{ top:66%; left:-14px; transform:rotate(-8deg); animation-delay:-5s; }
  .nft-4{ top:22%; right:14%; width:64px; height:80px; opacity:.28; animation-delay:-3.5s; }
  .nft-4 .pepe{ width:38px; height:38px; font-size:20px; }

  @keyframes floatY{ 0%,100%{ translate:0 0; } 50%{ translate:0 -18px; } }

  /* APP */
  #app{
    position:relative; z-index:1;
    height:100%; display:flex; flex-direction:column;
    padding:16px 16px calc(92px + env(safe-area-inset-bottom));
    overflow:hidden;
  }

  .header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .logo{
    font-weight:900; font-size:19px;
    background:linear-gradient(90deg,#00ff9d,#5cbf4a,#00ff9d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .header-right{ display:flex; align-items:center; gap:8px; }
  
  .balance-pill{
    background:var(--card); border:1px solid var(--border);
    padding:8px 12px; border-radius:999px;
    font-size:14px; font-weight:800; color:var(--neon);
    display:flex; align-items:center; gap:6px;
  }
  .deposit-btn-top{
    background:linear-gradient(135deg,#00ff9d,#5cbf4a);
    border:none; padding:8px 12px; border-radius:999px;
    font-size:12px; font-weight:900; color:#001a10; cursor:pointer;
  }

  /* PAGES */
  .page{ flex:1; overflow-y:auto; display:none; padding-bottom:12px; }
  .page.active{ display:block; animation:fade .3s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .page::-webkit-scrollbar{ display:none; }

  .title{ font-size:22px; font-weight:900; margin-bottom:14px; }
  .title span{ color:var(--neon); }

  /* GAMES */
  .games-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .game-card{
    position:relative; background:var(--card2); border:1px solid var(--border);
    border-radius:22px; padding:18px 14px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer;
  }
  .game-card:active{ transform:scale(.96); }
  .game-card .emoji{ font-size:34px; }
  .game-card .name{ font-size:14px; font-weight:800; }
  .game-card .tag{ font-size:10px; color:var(--muted); }
  .game-card.coming{ opacity:.42; cursor:default; border-style:dashed; justify-content:center; min-height:110px; }
  .game-card .nft-badge{
    position:absolute; top:8px; right:8px; font-size:8px; font-weight:900;
    padding:3px 7px; border-radius:999px; background:var(--neon); color:#001a10;
  }

  /* SLOTS */
  .game-wrap{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .slots{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    width:100%; max-width:340px; background:var(--card);
    border:1px solid var(--border); border-radius:24px; padding:14px;
  }
  .cell{
    aspect-ratio:1; border-radius:16px; background:#0d1f18;
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-size:32px;
  }
  .cell.spin{ animation:spin .12s linear infinite; }
  @keyframes spin{ 50%{ transform:scale(.92); opacity:.6; } }
  .cell.win{ border-color:var(--neon); box-shadow:0 0 20px rgba(0,255,157,.6); }

  .bet-row{ display:flex; align-items:center; gap:10px; }
  .bet-btn{
    width:44px; height:44px; border-radius:14px; background:var(--card);
    border:1px solid var(--border); color:var(--neon); font-size:20px; font-weight:800;
  }
  .bet-val{
    min-width:90px; text-align:center; background:var(--card);
    border:1px solid var(--border); border-radius:14px; padding:12px;
    font-weight:800; color:var(--neon);
  }
  .spin-btn{
    width:100%; max-width:340px; padding:18px; border:none; border-radius:20px;
    font-size:17px; font-weight:900; color:#001a10;
    background:linear-gradient(135deg,#00ff9d,#5cbf4a);
  }
  .spin-btn:active{ transform:scale(.97); }
  .spin-btn:disabled{ opacity:.5; }
  .result{ font-size:14px; font-weight:800; min-height:20px; }
  .result.win{ color:var(--neon); }
  .result.lose{ color:#ff5b7f; }

  /* PROFILE */
  .profile-card{
    background:var(--card2); border:1px solid var(--border);
    border-radius:24px; padding:22px; text-align:center; margin-bottom:14px;
  }
  .avatar{
    width:78px; height:78px; border-radius:50%; margin:0 auto 12px;
    background:radial-gradient(circle, #7de86a, #2f7d24);
    display:flex; align-items:center; justify-content:center; font-size:36px;
  }
  .profile-name{ font-size:18px; font-weight:900; }
  .profile-id{ font-size:12px; color:var(--muted); }
  .profile-balance{ font-size:34px; font-weight:900; color:var(--neon); margin-top:16px; }

  .action-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .action-btn{
    padding:18px; border-radius:20px; border:1px solid var(--border);
    background:var(--card2); color:white; font-weight:800;
  }
  .info-block{
    background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:16px; margin-bottom:12px;
  }
  .info-block h4{ font-size:13px; color:var(--neon); margin-bottom:8px; }
  .info-block p{ font-size:12px; color:var(--muted); line-height:1.5; }

  /* NAV */
  .nav{
    position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(8,20,16,.85); border:1px solid var(--border);
    border-radius:24px; display:flex; padding:8px; z-index:10;
  }
  .nav-btn{
    flex:1; padding:12px; border-radius:18px; border:none;
    background:transparent; color:var(--muted); font-weight:800; cursor:pointer;
  }
  .nav-btn.active{ background:rgba(0,255,157,.15); color:var(--neon); }

  /* MODAL */
  .modal-mask{
    position:fixed; inset:0; z-index:50; display:none;
    background:rgba(0,0,0,.7); align-items:flex-end;
  }
  .modal-mask.show{ display:flex; }
  .modal{
    width:100%; background:#0a1410; border-radius:28px 28px 0 0;
    padding:22px; position:relative;
  }
  .close-x{ position:absolute; top:14px; right:18px; font-size:22px; background:none; border:none; color:white; }
  .input-field{ width:100%; padding:16px; border-radius:16px; background:#0d1f18; border:1px solid var(--border); color:white; margin-bottom:10px; }
  .confirm-btn{ width:100%; padding:16px; border-radius:16px; background:var(--neon); font-weight:900; border:none; }
</style>
</head>
<body>

<div id="bg">
  <div class="nft-float nft-1"><div class="pepe">🐸</div><div class="tag">PEPE</div><div class="id">#0421</div></div>
  <div class="nft-float nft-2"><div class="pepe">🐸</div><div class="tag">PEPE</div><div class="id">#1337</div></div>
  <div class="nft-float nft-3"><div class="pepe">🐸</div><div class="tag">PEPE</div><div class="id">#7777</div></div>
</div>

<div id="app">
  <div class="header">
    <div class="logo">🐸 GARISDROP</div>
    <div class="header-right">
      <button class="deposit-btn-top" onclick="alert('Скоро!')">+ Пополнить</button>
      <div class="balance-pill">⭐ <span id="balanceTop">0</span></div>
    </div>
  </div>

  <!-- ИГРЫ -->
  <div class="page active" id="page-games">
    <div class="title">Игры <span>▸</span></div>
    <div class="games-grid">
      <div class="game-card" onclick="openGame()">
        <div class="nft-badge">HOT</div>
        <div class="emoji">🍌🎰</div>
        <div class="name">3 в ряд</div>
        <div class="tag">x3</div>
      </div>
      <div class="game-card coming"><div class="emoji">🎲</div><div class="name">Скоро</div></div>
      <div class="game-card coming"><div class="emoji">🃏</div><div class="name">Скоро</div></div>
      <div class="game-card coming"><div class="emoji">🐸</div><div class="name">Скоро</div></div>
    </div>
  </div>

  <!-- СЛОТЫ -->
  <div class="page" id="page-slot">
    <div class="title">🍌 3 в ряд</div>
    <div class="game-wrap">
      <div class="slots" id="slots">
        <div class="cell">🍌</div><div class="cell">🎰</div><div class="cell">🍌</div>
        <div class="cell">🎰</div><div class="cell">🍌</div><div class="cell">🎰</div>
        <div class="cell">🍌</div><div class="cell">🎰</div><div class="cell">🍌</div>
      </div>
      <div class="bet-row">
        <button class="bet-btn" onclick="changeBet(-10)">−</button>
        <div class="bet-val">Ставка <span id="betVal">10</span></div>
        <button class="bet-btn" onclick="changeBet(10)">+</button>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spin()">КРУТИТЬ 🎰</button>
      <div class="result" id="result"></div>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div class="page" id="page-profile">
    <div class="title">Профиль <span>▸</span></div>
    <div class="profile-card">
      <div class="avatar">🐸</div>
      <div class="profile-name" id="userName">Игрок</div>
      <div class="profile-id" id="userId">ID: —</div>
      <div class="profile-balance"><small>⭐</small> <span id="balanceProfile">0</span></div>
    </div>
    <div class="action-row">
      <button class="action-btn" onclick="openModal('deposit')">＋ Пополнить</button>
      <button class="action-btn" onclick="openModal('withdraw')">↗ Вывести</button>
    </div>
    <div class="info-block">
      <h4>💳 Карта</h4>
      <p>Мин. <b>1100 ₽</b>, комиссия <b>5%</b>.</p>
    </div>
    <div class="info-block">
      <h4>⭐ Звезды</h4>
      <p>Мин. <b>500 ⭐</b>, сумма кратна <b>100</b>.</p>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" id="nav-games" onclick="switchPage('games')">🎮 Игры</button>
  <button class="nav-btn" id="nav-profile" onclick="switchPage('profile')">👤 Профиль</button>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// --- ДАННЫЕ ---
const STATE = { balance: 1000, bet: 10, spinning: false };
const SYMBOLS = ['🍌','🎰','💎','🍒','⭐'];

// --- TELEGRAM ---
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  if (Telegram.WebApp.initDataUnsafe?.user) {
    document.getElementById('userName').textContent = Telegram.WebApp.initDataUnsafe.user.first_name;
    document.getElementById('userId').textContent = 'ID: ' + Telegram.WebApp.initDataUnsafe.user.id;
  }
}

// --- НАВИГАЦИЯ ---
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
}

function openGame() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-slot').classList.add('active');
  document.getElementById('nav-games').classList.add('active');
}

// --- ИГРА ---
function updateUI() {
  document.getElementById('balanceTop').textContent = STATE.balance;
  document.getElementById('balanceProfile').textContent = STATE.balance;
  document.getElementById('betVal').textContent = STATE.bet;
}

function changeBet(d) {
  if (STATE.spinning) return;
  let nb = STATE.bet + d;
  if (nb >= 10 && nb <= STATE.balance) { STATE.bet = nb; updateUI(); }
}

function spin() {
  if (STATE.spinning || STATE.balance < STATE.bet) return;
  STATE.spinning = true;
  STATE.balance -= STATE.bet;
  updateUI();
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('result').textContent = '';
  
  const cells = document.querySelectorAll('#slots .cell');
  cells.forEach(c => { c.classList.add('spin'); c.classList.remove('win'); });
  
  const interval = setInterval(() => {
    cells.forEach(c => c.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
  }, 70);

  setTimeout(() => {
    clearInterval(interval);
    let grid = [];
    for (let i = 0; i < 9; i++) grid.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
    
    let win = false;
    if (Math.random() < 0.08) { // 8% шанс
      const line = Math.floor(Math.random() * 3);
      const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      grid[line*3] = sym; grid[line*3+1] = sym; grid[line*3+2] = sym;
      win = true;
    }

    cells.forEach((c, i) => {
      c.classList.remove('spin');
      c.textContent = grid[i];
      if (win && (i === Math.floor(i/3)*3 || i === Math.floor(i/3)*3+1 || i === Math.floor(i/3)*3+2)) {
        // Подсветка выигрышной линии
        if (grid[i] === grid[Math.floor(i/3)*3] && grid[i] === grid[Math.floor(i/3)*3+1] && grid[i] === grid[Math.floor(i/3)*3+2]) {
            c.classList.add('win');
        }
      }
    });

    if (win) {
      STATE.balance += STATE.bet * 3;
      document.getElementById('result').textContent = `🎉 Выигрыш +${STATE.bet * 3} ⭐`;
      document.getElementById('result').className = 'result win';
    } else {
      document.getElementById('result').textContent = `−${STATE.bet} ⭐`;
      document.getElementById('result').className = 'result lose';
    }

    updateUI();
    STATE.spinning = false;
    document.getElementById('spinBtn').disabled = false;
  }, 1200);
}

// --- МОДАЛКИ ---
function openModal(type) {
  const c = document.getElementById('modalContent');
  if (type === 'withdraw') {
    c.innerHTML = `
      <h3>Вывод средств</h3>
      <button class="action-btn" onclick="withdrawCard()" style="width:100%; margin-bottom:10px;">💳 На карту</button>
      <button class="action-btn" onclick="withdrawStars()" style="width:100%;">⭐ Звёздами</button>
    `;
  } else {
    c.innerHTML = `
      <h3>Пополнение</h3>
      <p style="margin-bottom:10px; font-size:12px;">Скоро будет доступно!</p>
    `;
  }
  document.getElementById('modalMask').classList.add('show');
}

function closeModal() {
  document.getElementById('modalMask').classList.remove('show');
}

function withdrawCard() {
  const c = document.getElementById('modalContent');
  c.innerHTML = `
    <h3>💳 Вывод на карту</h3>
    <input class="input-field" id="cardAmount" type="number" placeholder="Сумма (мин. 1100 ₽)" inputmode="numeric">
    <button class="confirm-btn" onclick="confirmCard()">Вывести</button>
  `;
}

function confirmCard() {
  const v = parseFloat(document.getElementById('cardAmount').value) || 0;
  if (v < 1100) { alert('Минимум 1100 ₽'); return; }
  if (v > STATE.balance) { alert('Недостаточно средств'); return; }
  STATE.balance -= v;
  updateUI();
  closeModal();
  alert(`Заявка на вывод ${Math.floor(v * 0.95)} ₽ создана (комиссия 5%).`);
}

function withdrawStars() {
  const c = document.getElementById('modalContent');
  c.innerHTML = `
    <h3>⭐ Вывод звёздами</h3>
    <input class="input-field" id="starAmount" type="number" placeholder="Кол-во звёзд (мин. 500)" inputmode="numeric">
    <button class="confirm-btn" onclick="confirmStars()">Вывести</button>
  `;
}

function confirmStars() {
  const v = parseFloat(document.getElementById('starAmount').value) || 0;
  if (v < 500 || v % 100 !== 0) { alert('Сумма должна быть от 500 и кратна 100'); return; }
  if (v > STATE.balance) { alert('Недостаточно средств'); return; }
  STATE.balance -= v;
  updateUI();
  closeModal();
  alert('Заявка на вывод звёзд создана!');
}

// Запуск
updateUI();
</script>
</body>
</html>
