<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GarisDrop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgrphceMHytjNPu0FMH4ZQAyykOHnnwt8",
    authDomain: "garisdrop.firebaseapp.com",
    projectId: "garisdrop",
    storageBucket: "garisdrop.firebasestorage.app",
    messagingSenderId: "1091919506726",
    appId: "1:1091919506726:web:9f18f735c125d0324da5e7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  window.db = db; 
  window.doc = doc; window.getDoc = getDoc; window.setDoc = setDoc; window.updateDoc = updateDoc;
  window.collection = collection; window.getDocs = getDocs; 
</script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  :root{ --accent: #34d399; --bg: #0f172a; --card: #1e293b; --border: rgba(255,255,255,0.08); --text: #f8fafc; --muted: #94a3b8; --red: #fb7185; }
  html,body{ height:100%; background:var(--bg); color:var(--text); overflow:hidden; }
  
  .loader-overlay { position: fixed; inset: 0; z-index: 999; background: rgba(15,23,42,0.9); display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .loader-overlay.show { display: flex; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(52, 211, 153, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  
  #app{ position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; padding:16px 16px calc(96px + env(safe-area-inset-bottom)); overflow:hidden; }
  
  .header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-shrink: 0; width: 100%;}
  .logo{ font-weight:800; font-size:18px; color:var(--text); letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;}
  .header-logo { width: 28px; height: 28px; object-fit: contain; border-radius: 50%; }
  .header-right{ display:flex; align-items:center; gap:8px; flex-shrink: 0;}
  
  .deposit-btn-large { background: var(--accent); border: none; color: #064e3b; height: 36px; padding: 0 14px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 4px;}
  .deposit-btn-large:active { transform: scale(0.95); }
  
  .balance-pill{ background:var(--card); border:1px solid var(--border); height: 36px; padding: 0 12px; border-radius:12px; font-size:15px; font-weight:800; color:var(--accent); display:flex; align-items:center; gap:4px; transition: all 0.2s;}
  .balance-pill.update { transform: scale(1.05); border-color: var(--accent); }
  
  .online-bar { display: flex; align-items: center; justify-content: flex-start; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .online-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
  .online-bar b { color: var(--text); }

  .page{ flex:1; min-height: 0; overflow-y:auto; display:none; flex-direction: column; padding-bottom:12px; }
  .page.active{ display:flex; animation: fadeIn 0.3s ease;}
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .title{ font-size:24px; font-weight:800; margin-bottom:16px; flex-shrink: 0; letter-spacing: -0.5px;}
  
  .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-bottom: 16px; width: fit-content; transition: transform 0.1s; }
  .back-btn:active { transform: scale(0.95); }
  
  .games-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-content: start; }
  .game-card{ position:relative; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:24px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; cursor:pointer; transition: all 0.2s; }
  .game-card:active{ transform:scale(.97); border-color: var(--accent);}
  
  .game-icon-container {
    width: 100px;
    height: 100px;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
  }
  
  .game-icon-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.15); 
  }
  
  .game-card .name{ font-size:16px; font-weight:800; text-align: center; }
  .game-card .tag{ font-size:11px; color:var(--muted); text-align: center; font-weight: 500;}
  
  .game-wrap{ display:flex; flex-direction:column; align-items:center; gap:16px; width: 100%; }
  .mode-selector { display: flex; gap: 8px; width: 100%; max-width: 400px; margin-bottom: 4px; }
  .mode-btn { flex: 1; padding: 12px 0; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .mode-btn.active { background: rgba(52, 211, 153, 0.1); color: var(--accent); border-color: var(--accent); }
  
  /* СЛОТЫ */
  .slots-wrapper { position: relative; width: 100%; max-width: 400px; padding: 0; }
  .slots{ display:grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap:8px; width:100%; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:16px; position: relative; overflow: hidden; }
  .slots::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 25%; background: linear-gradient(to bottom, rgba(30,41,59,1), transparent); pointer-events: none; z-index: 2; }
  .slots::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 25%; background: linear-gradient(to top, rgba(30,41,59,1), transparent); pointer-events: none; z-index: 2; }
  .win-line-top, .win-line-bottom { position: absolute; left: 10px; right: 10px; height: 1px; background: rgba(251, 113, 133, 0.3); z-index: 3; pointer-events: none; }
  .win-line-top { top: 33.33%; transform: translateY(-50%); }
  .win-line-bottom { top: 66.66%; transform: translateY(-50%); }
  .cell{ aspect-ratio:1; border-radius:16px; background:rgba(15,23,42,0.6); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size: clamp(24px, 7vw, 36px); transition: transform 0.1s, opacity 0.1s; position: relative; z-index: 1; }
  .cell img { width: 65%; height: 65%; object-fit: contain; }
  .cell.spinning { animation: slotSpin 0.2s linear infinite; filter: blur(2px); opacity: 0.7; }
  @keyframes slotSpin { 0% { transform: translateY(-30%); opacity: 0; } 50% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(30%); opacity: 0; } }
  .cell.win{ border-color:var(--accent); box-shadow: inset 0 0 15px rgba(52,211,153,0.3); background: rgba(52,211,153,0.1); transform: scale(1.05); z-index: 4; }
  
  /* АПГРЕЙДЕР */
  .upgrade-container { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .upgrade-bar-wrapper { position: relative; width: 100%; padding: 10px 0; }
  .upgrade-bar-bg { width: 100%; height: 16px; background: var(--bg); border-radius: 8px; position: relative; overflow: hidden; border: 1px solid var(--border); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
  .upgrade-bar-win { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #059669, var(--accent)); border-right: 2px solid var(--accent); transition: width 0.3s ease; z-index: 1; box-shadow: 0 0 15px var(--accent); }
  .upgrade-marker { position: absolute; top: -2px; bottom: -2px; width: 4px; background: #fff; border-radius: 2px; z-index: 2; transition: left 2.5s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 15px #fff, 0 0 30px var(--accent); left: 0%; }
  
  .upgrade-info { display: flex; justify-content: space-between; align-items: center; margin-top: -10px; font-size: 14px; }
  .upgrade-info span { color: var(--muted); font-weight: 600;}
  .upgrade-info b { font-weight: 800; font-size: 16px; }
  
  .upgrade-multipliers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mult-btn { padding: 14px 0; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 800; font-size: 15px; cursor: pointer; transition: all 0.2s; }
  .mult-btn.active { background: rgba(52, 211, 153, 0.15); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(52, 211, 153, 0.2); }
  
  .bet-row{ display:flex; align-items:center; gap:12px; justify-content: center; width: 100%; }
  .bet-btn{ width:48px; height:48px; border-radius:16px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:24px; font-weight:600; cursor:pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center;}
  .bet-btn:active{ transform:scale(0.9); } .bet-btn:disabled { opacity: 0.3; }
  .bet-input-wrap { background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:0 16px; display:flex; align-items:center; height:48px; }
  .bet-input-wrap span { color:var(--muted); font-size:14px; margin-right:8px; font-weight: 600;}
  .bet-input-wrap input { width: 60px; background: transparent; border: none; outline: none; color: var(--accent); font-size: 18px; font-weight: 800; text-align: center; }
  .bet-input-wrap input:disabled { opacity: 0.5; }
  
  .main-action-btn{ width:100%; max-width: 400px; padding:18px; border:none; border-radius:18px; font-size:17px; font-weight:800; color: #064e3b; background:var(--accent); cursor:pointer; transition: all 0.2s; }
  .main-action-btn:active{ transform:scale(.97); } .main-action-btn:disabled{ opacity:.5; cursor:not-allowed; }
  
  /* ПРОФИЛЬ И БОНУСЫ */
  .profile-card{ background:var(--card); border:1px solid var(--border); border-radius:28px; padding:32px 24px; text-align:center; margin-bottom:20px; display: flex; flex-direction: column; align-items: center;}
  .avatar{ width:90px; height:90px; border-radius:50%; margin:0 auto 16px; background:var(--bg); border: 3px solid var(--card); display:flex; align-items:center; justify-content:center; font-size:40px; position: relative; overflow: hidden;}
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name{ font-size:22px; font-weight:800; letter-spacing: -0.5px;}
  .profile-id{ font-size:13px; color:var(--muted); margin-top: 6px; font-weight: 500;}
  .profile-balance{ font-size:40px; font-weight:800; color:var(--text); margin-top:24px; display: flex; align-items: center; gap: 8px;}
  .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; width: 100%;}
  .action-btn-icon { padding:18px 12px; border-radius:18px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:700; cursor:pointer; display:flex; align-items: center; justify-content: center; gap:8px; font-size:14px; transition: 0.2s;}
  .action-btn-icon:active { background: rgba(255,255,255,0.05); }
  .action-btn-icon .ic { font-size: 18px; }
  .bonus-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 24px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px;}
  .bonus-card h3 { color: var(--text); font-size: 18px; font-weight: 800;}
  .bonus-card p { font-size: 14px; color: var(--muted); line-height: 1.4;}
  .bonus-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; background: rgba(52,211,153,0.1); color: var(--accent); transition: 0.2s; }
  .bonus-btn:active { background: rgba(52,211,153,0.2); }
  
  .nav{ position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); background:rgba(30,41,59,0.9); border:1px solid var(--border); border-radius:24px; display:flex; padding:8px; z-index:10; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .nav-btn{ flex:1; padding:14px 5px; border-radius:16px; border:none; background:transparent; color:var(--muted); font-weight:700; cursor:pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px;}
  .nav-btn.active{ background:var(--card); color:var(--accent); }
  
  .modal-mask{ position:fixed; inset:0; z-index:50; display:none; background:rgba(15,23,42,0.8); align-items:center; justify-content:center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .modal-mask.show{ display:flex; }
  .modal{ width:90%; max-width:340px; background:var(--card); border-radius:28px; padding:32px 24px; position:relative; text-align:center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border); }
  @keyframes popIn { from { transform: scale(0.9) translateY(10px); opacity: 0;} to { transform: scale(1) translateY(0); opacity: 1;} }
  .modal-close-btn { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: all 0.2s; }
  .modal-close-btn:active { background: rgba(255,255,255,0.1); color: white; }
  .modal-brand-top { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: var(--text); margin-bottom: 24px; }
  .modal-brand-bottom { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 24px; }
  .modal.win { border: 1px solid rgba(52, 211, 153, 0.4); box-shadow: 0 0 40px rgba(52, 211, 153, 0.1); }
  .icon-win { width: 80px; height: 80px; border-radius: 50%; background: rgba(52,211,153,0.1); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .icon-win svg { width: 40px; height: 40px; stroke: var(--accent); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .modal.win h3 { color: var(--text); font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .modal.lose { border: 1px solid var(--border); }
  .icon-lose { width: 80px; height: 80px; border-radius: 50%; background: var(--bg); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .icon-lose svg { width: 36px; height: 36px; stroke: var(--muted); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .modal.lose h3 { color: var(--text); font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .modal.lose p { color: var(--muted); font-size: 15px; margin-bottom: 24px; line-height: 1.4; }
  .win-amount { font-size: 36px; font-weight: 800; color: var(--text); display: block; margin: 12px 0; letter-spacing: -1px; display: flex; justify-content: center; align-items: center; gap: 8px;}
  .modal-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 12px; transition: transform 0.15s; }
  .modal-btn:active { transform: scale(0.96); }
  .modal-btn.green { background: var(--accent); color: #064e3b; }
  .modal-btn.purple { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  
  .input-group { display: flex; flex-direction: column; text-align: left; width: 100%; margin-top: 16px; gap: 8px; }
  .input-group label { font-size: 13px; color: var(--muted); font-weight: 600;}
  .input-group input { width: 100%; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; color: var(--text); font-size: 16px; font-weight: 700; outline: none; transition: border 0.2s;}
  .input-group input:focus { border-color: var(--accent); }
  
  #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 24px; border-radius: 16px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideDown 0.3s ease, fadeOut 0.3s ease 2.7s forwards; }
  @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  .star-icon { width: 1em; height: 1em; vertical-align: middle; display: inline-block; object-fit: contain; }
  .star-icon-large { width: 1.2em; height: 1.2em; vertical-align: middle; display: inline-block; object-fit: contain; }
</style>
</head>
<body>

<div id="loader" class="loader-overlay show"><div class="spinner"></div></div>
<div id="toast-container"></div>

<div id="app">
  <div class="header">
    <div class="logo">
      <img src="https://i.ibb.co/dszwWHNB/Garis-Drop.png" class="header-logo" alt="logo">
      GARISDROP
    </div>
    <div class="header-right">
      <button class="deposit-btn-large" onclick="openDepositModal()">Пополнить</button>
      <div class="balance-pill" id="balancePillHeader">
        <span id="currencyIcon"><img src="https://i.ibb.co/mCMTLBfh/image.png" class="star-icon" alt="star"></span> <span id="balanceTop">0</span>
      </div>
    </div>
  </div>

  <div class="online-bar">
    <div class="online-dot"></div>
    <span>Онлайн: <b id="onlineCount">...</b></span>
  </div>

  <div class="page active" id="page-games">
    <div class="title">Игры</div>
    <div class="games-grid">
      <div class="game-card" onclick="openGame('slots')">
        <div class="game-icon-container">
          <img src="https://i.ibb.co/MD04bpxG/1793517333251.png" alt="Слоты">
        </div>
        <div class="name">Слоты</div>
        <div class="tag">3 режима</div>
      </div>
      <div class="game-card" onclick="openGame('upgrade')">
        <div class="game-icon-container">
          <img src="https://i.ibb.co/sdXJbB9c/acd9550b-0175-406c-bada-7e647b883525.png" alt="Апгрейдер">
        </div>
        <div class="name">Апгрейдер</div>
        <div class="tag">Испытай удачу</div>
      </div>
    </div>
  </div>

  <div class="page" id="page-bonus">
    <div class="title">Бонусы</div>
    <div class="bonus-card">
      <h3>👥 Пригласи друга</h3>
      <p>Отправь другу свою ссылку. Когда он зайдет и начнет играть, вы оба получите бонусы!</p>
      <div class="input-group" style="margin-top: 10px;">
        <label>Твоя ссылка для приглашения:</label>
        <input type="text" id="refLinkInput" readonly value="Загрузка..." style="font-size: 13px; color: var(--muted);">
      </div>
      <button class="bonus-btn" onclick="copyRefLink()">Скопировать ссылку</button>
      <div style="margin-top: 15px; background: var(--bg); padding: 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);">
        <span style="color: var(--muted); font-size: 14px;">Вы пригласили:</span>
        <b style="font-size: 20px; color: var(--accent);"><span id="refCount">0</span> чел.</b>
      </div>
    </div>
  </div>

  <div class="page" id="page-slots">
    <button class="back-btn" onclick="switchPage('games')">← Назад</button>
    <div class="game-wrap">
      <div class="mode-selector">
        <button class="mode-btn active" id="btn-slot-easy" onclick="setSlotMode('easy')">Легкий</button>
        <button class="mode-btn" id="btn-slot-medium" onclick="setSlotMode('medium')">Средний</button>
        <button class="mode-btn" id="btn-slot-hard" onclick="setSlotMode('hard')">Сложный</button>
      </div>
      <div class="slots-wrapper">
        <div class="win-line-top"></div><div class="win-line-bottom"></div>
        <div class="slots" id="slots"></div>
      </div>
      <div class="bet-row">
        <button class="bet-btn" id="slot-betMinus" onclick="changeSlotBet(-1)">−</button>
        <div class="bet-input-wrap"><span>Ставка:</span><input type="number" id="slot-betInput" value="5" min="5" onchange="validateSlotBetInput()"></div>
        <button class="bet-btn" id="slot-betPlus" onclick="changeSlotBet(1)">+</button>
      </div>
      <button class="main-action-btn" id="spinBtn" onclick="spinSlots()">КРУТИТЬ 🎰</button>
    </div>
  </div>

  <div class="page" id="page-upgrade">
    <button class="back-btn" onclick="switchPage('games')">← Назад</button>
    <div class="game-wrap">
      <div class="upgrade-container">
        <div class="upgrade-bar-wrapper">
          <div class="upgrade-bar-bg">
            <div class="upgrade-bar-win" id="upgradeBarWin"></div>
            <div class="upgrade-marker" id="upgradeMarker"></div>
          </div>
        </div>
        
        <div class="upgrade-info">
          <span>Шанс: <b id="winChanceText" style="color: var(--accent);">47.5%</b></span>
          <span>Выигрыш: <b id="potentialWinText" style="color: var(--text);">7.5</b> ⭐</span>
        </div>
        
        <div class="upgrade-multipliers" id="multipliers">
          <button class="mult-btn active" onclick="setMultiplier(1.5, this)">x1.5</button>
          <button class="mult-btn" onclick="setMultiplier(2.0, this)">x2.0</button>

<script>
const SYMBOLS = ['🍌','🎰','💎','🍒','https://i.ibb.co/mCMTLBfh/image.png']; 
const API_URL = 'https://garisdrop-backend.garisnazar1.workers.dev';

// ЗВУКИ
let audioCtx;
document.body.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

function playTone(freq, type, duration, vol = 0.02) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
}

const SOUNDS = {
  click: () => playTone(600, 'sine', 0.05, 0.01),
  win: () => { 
    playTone(523.25, 'sine', 0.4, 0.02); 
    setTimeout(() => playTone(659.25, 'sine', 0.4, 0.02), 100); 
    setTimeout(() => playTone(783.99, 'sine', 0.6, 0.02), 200); 
  },
  lose: () => { 
    playTone(349.23, 'sine', 0.3, 0.02); 
    setTimeout(() => playTone(293.66, 'sine', 0.4, 0.02), 150); 
  },
  spinTick: () => playTone(1200, 'triangle', 0.02, 0.005),
  upgradeSweep: () => {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 2.5);
    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 2);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.6);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 2.5);
  }
};

document.querySelectorAll('button, .game-card, .nav-btn, .back-btn, .bonus-btn, .mult-btn').forEach(el => {
  el.addEventListener('click', () => SOUNDS.click());
});

function showToast(text) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = text;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

let STATE = { balance: 0, userId: null, referralsCount: 0 };
let userDocRef = null;

function initUserId() {
  let tgId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
  if (tgId) return String(tgId);
  let savedId = localStorage.getItem('garisDropUserId');
  if (!savedId) { savedId = String(Math.floor(Math.random() * 9000000) + 1000000); localStorage.setItem('garisDropUserId', savedId); }
  return savedId;
}

async function checkReferral() {
  const urlParams = new URLSearchParams(window.location.search);
  const startParam = window.Telegram?.WebApp?.initDataUnsafe?.start_param || urlParams.get('startapp');
  
  if (startParam && startParam !== STATE.userId) {
    try {
      await fetch(`${API_URL}/referral`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newUserId: STATE.userId, referrerId: startParam })
      });
    } catch (e) { console.log("Ref error", e); }
  }
}

async function updateOnlineStatus() {
  if (!userDocRef) return;
  try {
    await window.updateDoc(userDocRef, { lastSeen: new Date() });
    const usersRef = window.collection(window.db, "users");
    const snapshot = await window.getDocs(usersRef);
    let count = 0;
    const now = Date.now();
    snapshot.forEach(doc => {
      const data = doc.data();
      if (data.lastSeen) {
        const time = data.lastSeen.toMillis ? data.lastSeen.toMillis() : new Date(data.lastSeen).getTime();
        if (now - time < 5 * 60 * 1000) count++;
      }
    });
    document.getElementById('onlineCount').textContent = count;
  } catch(e) { console.log("Online update error", e); }
}

async function initUserData() {
  STATE.userId = initUserId();
  updateUI(); 
  
  if (!window.db) return finishLoading();

  const { doc, getDoc, setDoc } = window;
  userDocRef = doc(window.db, "users", STATE.userId);

  try {
    const docSnap = await getDoc(userDocRef);
    if (!docSnap.exists()) {
      await setDoc(userDocRef, { balance: 0, referralsCount: 0, lastSeen: new Date(), createdAt: new Date() });
    } else {
      const data = docSnap.data();
      STATE.balance = data.balance || 0;
      STATE.referralsCount = data.referralsCount || 0;
    }
    
    const refLink = `https://t.me/GarisDrop_Bot?startapp=${STATE.userId}`;
    document.getElementById('refLinkInput').value = refLink;
    document.getElementById('refCount').textContent = STATE.referralsCount;

    updateUI(); 
    finishLoading(); 
    
    checkReferral();
    updateOnlineStatus();
    setInterval(updateOnlineStatus, 30000);
  } catch (e) {
    finishLoading();
  }
}

function finishLoading() {
  document.getElementById('loader').classList.remove('show');
}

if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready(); Telegram.WebApp.expand();
  const tgUser = Telegram.WebApp.initDataUnsafe?.user;
  if (tgUser) {
    document.getElementById('userName').textContent = tgUser.first_name || 'Игрок';
    if (tgUser.photo_url) {
      document.getElementById('profileAvatar').innerHTML = `<img src="${tgUser.photo_url}" alt="avatar">`;
    }
  }
}

// ОБНОВЛЕННАЯ ФУНКЦИЯ ФОРМАТИРОВАНИЯ (БЕЗ К И M)
function formatMoney(starsAmount) {
  if (isNaN(starsAmount) || !isFinite(starsAmount)) return '0';
  return Math.floor(starsAmount).toLocaleString('ru-RU'); // Возвращает полное число с пробелами (например 25 000)
}

function updateUI() {
  const displayBalance = formatMoney(STATE.balance);
  document.getElementById('balanceTop').textContent = displayBalance;
  document.getElementById('balanceProfile').textContent = formatMoney(STATE.balance);
  document.getElementById('userId').textContent = `ID: ${STATE.userId}`; 
  
  if (document.getElementById('slot-betInput')) document.getElementById('slot-betInput').value = formatMoney(slotState.bet);
  if (document.getElementById('upg-betInput')) document.getElementById('upg-betInput').value = formatMoney(upgradeState.bet);
  if (document.getElementById('potentialWinText')) document.getElementById('potentialWinText').textContent = formatMoney(upgradeState.bet * upgradeState.multiplier);
}

function copyRefLink() { 
  const linkInput = document.getElementById('refLinkInput');
  linkInput.select();
  linkInput.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(linkInput.value).then(() => { showToast('Ссылка скопирована!'); });
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const targetPage = document.getElementById('page-' + name);
  if (targetPage) { targetPage.classList.add('active'); targetPage.style.display = 'flex'; }
  if(name === 'games' || name === 'profile' || name === 'bonus') {
    const nav = document.getElementById('nav-' + name); if(nav) nav.classList.add('active');
  }
  updateUI();
}

function openGame(game) {
  document.getElementById('loader').classList.add('show');
  setTimeout(() => {
    document.getElementById('loader').classList.remove('show');
    if (game === 'slots') { switchPage('slots'); setSlotMode(slotState.mode); }
    if (game === 'upgrade') { switchPage('upgrade'); resetUpgrade(); }
  }, 300);
}

/* ================= СЛОТЫ ================= */
const SLOT_MODES = { easy: { cols: 3, mult: 1.5 }, medium: { cols: 4, mult: 2.0 }, hard: { cols: 5, mult: 4.0 } };
let slotState = { mode: 'easy', bet: 5, spinning: false };

function renderSymbol(cell, symbol) {
  if (symbol === 'https://i.ibb.co/mCMTLBfh/image.png') {
    cell.innerHTML = `<img src="${symbol}" alt="star">`;
  } else {
    cell.textContent = symbol;
  }
}

function setSlotMode(mode) {
  if (slotState.spinning) return;
  slotState.mode = mode;
  document.querySelectorAll('[id^="btn-slot-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-slot-' + mode).classList.add('active');
  const cols = SLOT_MODES[mode].cols;
  const slotsContainer = document.getElementById('slots');
  slotsContainer.style.setProperty('--cols', cols);
  slotsContainer.innerHTML = '';
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < cols; col++) {
      let cell = document.createElement('div');
      cell.className = 'cell'; cell.dataset.col = col; cell.dataset.row = row;
      renderSymbol(cell, SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
      slotsContainer.appendChild(cell);
    }
  }
  updateUI();
}

function changeSlotBet(d) { if (!slotState.spinning) { let nb = slotState.bet + d; if (nb >= 5 && nb <= STATE.balance) { slotState.bet = nb; updateUI(); } } }
function validateSlotBetInput() { let val = parseInt(document.getElementById('slot-betInput').value); if (isNaN(val) || val < 5) val = 5; if (val > STATE.balance) val = STATE.balance; slotState.bet = val; updateUI(); }

async function spinSlots() {
  if (slotState.spinning) return;
  if (slotState.bet < 5) return showToast('Минимальная ставка 5 звезд!');
  if (STATE.balance < slotState.bet) return showLoseModal(false, 'Недостаточно средств на балансе!');

  slotState.spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('slot-betMinus').disabled = true;
  document.getElementById('slot-betPlus').disabled = true;
  document.getElementById('slot-betInput').disabled = true;

  const cols = SLOT_MODES[slotState.mode].cols;
  const spinIntervals = [];
  for (let col = 0; col < cols; col++) {
    const interval = setInterval(() => {
      for (let row = 0; row < 3; row++) {
        const cell = document.querySelector(`.cell[data-col="${col}"][data-row="${row}"]`);
        if (!cell.classList.contains('win')) {
          cell.classList.add('spinning');
          renderSymbol(cell, SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
        }
      }
    }, 50);
    spinIntervals.push(interval);
  }

  try {
    const response = await fetch(`${API_URL}/spin`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: STATE.userId, bet: slotState.bet, mode: slotState.mode }) });
    const data = await response.json();

    if (!data.success) {
      spinIntervals.forEach(clearInterval);
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('spinning'));
      slotState.spinning = false;
      document.getElementById('spinBtn').disabled = false; document.getElementById('slot-betMinus').disabled = false; document.getElementById('slot-betPlus').disabled = false; document.getElementById('slot-betInput').disabled = false;
      return showLoseModal(false, data.error);
    }

    for (let col = 0; col < cols; col++) {
      setTimeout(() => {
        clearInterval(spinIntervals[col]);
        for (let row = 0; row < 3; row++) {
          const cell = document.querySelector(`.cell[data-col="${col}"][data-row="${row}"]`);
          cell.classList.remove('spinning');
          if (row === 1 && data.isWin) { renderSymbol(cell, 'https://i.ibb.co/mCMTLBfh/image.png'); cell.classList.add('win'); } 
          else { renderSymbol(cell, SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]); cell.classList.remove('win'); }
        }
        if (col === cols - 1) setTimeout(() => endSpinSecure(data), 300);
      }, (col + 1) * 400);
    }
  } catch (e) {
    spinIntervals.forEach(clearInterval);
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('spinning'));
    slotState.spinning = false;
    document.getElementById('spinBtn').disabled = false; document.getElementById('slot-betMinus').disabled = false; document.getElementById('slot-betPlus').disabled = false; document.getElementById('slot-betInput').disabled = false;
    showLoseModal(false, 'Ошибка сервера.');
  }
}

function endSpinSecure(data) {
  STATE.balance = data.newBalance;
  if (data.isWin) { SOUNDS.win(); showWinModal(data.winAmount, '⭐', 'Отличный выигрыш!'); }
  else { SOUNDS.lose(); showLoseModal(true, 'Повезет в следующий раз!'); }
  slotState.spinning = false;
  document.getElementById('spinBtn').disabled = false; document.getElementById('slot-betMinus').disabled = false; document.getElementById('slot-betPlus').disabled = false; document.getElementById('slot-betInput').disabled = false;
  updateUI();
}

/* ================= АПГРЕЙДЕР ================= */
let upgradeState = { bet: 5, multiplier: 1.5, playing: false };

function resetUpgrade() {
  upgradeState.playing = false;
  document.getElementById('upgradeMarker').style.left = '0%';
  document.getElementById('upgradeBarWin').style.width = ((100 / upgradeState.multiplier) * 0.95) + '%';
  document.getElementById('winChanceText').textContent = (((100 / upgradeState.multiplier) * 0.95).toFixed(1)) + '%';
  updateUI();
}

function setMultiplier(mult, btn) {
  if (upgradeState.playing) return;
  upgradeState.multiplier = mult;
  document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  resetUpgrade();
}

function changeUpgBet(d) {
  if (upgradeState.playing) return;
  let nb = upgradeState.bet + d;
  if (nb >= 5 && nb <= STATE.balance) { upgradeState.bet = nb; updateUI(); }
}
function validateUpgBetInput() {
  if (upgradeState.playing) return;
  let val = parseInt(document.getElementById('upg-betInput').value);
  if (isNaN(val) || val < 5) val = 5;
  if (val > STATE.balance) val = STATE.balance;
  upgradeState.bet = val;
  updateUI();
}

async function playUpgrade() {
  if (upgradeState.playing) return;
  if (upgradeState.bet < 5) return showToast('Минимальная ставка 5 звезд!');
  if (STATE.balance < upgradeState.bet) return showLoseModal(false, 'Недостаточно средств!');

  upgradeState.playing = true;
  document.getElementById('upgradeBtn').disabled = true;
  document.getElementById('upg-betMinus').disabled = true;
  document.getElementById('upg-betPlus').disabled = true;
  document.getElementById('upg-betInput').disabled = true;

  const marker = document.getElementById('upgradeMarker');
  marker.style.transition = 'none';
  marker.style.left = '0%';
  
  setTimeout(async () => {
    marker.style.transition = 'left 2.5s cubic-bezier(0.22, 1, 0.36, 1)'; 
    SOUNDS.upgradeSweep(); 
    
    try {
      const response = await fetch(`${API_URL}/upgrade`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: STATE.userId, bet: upgradeState.bet, multiplier: upgradeState.multiplier })
      });
      const data = await response.json();

      if (!data.success) {
        upgradeState.playing = false;
        document.getElementById('upgradeBtn').disabled = false;
        document.getElementById('upg-betMinus').disabled = false;
        document.getElementById('upg-betPlus').disabled = false;
        document.getElementById('upg-betInput').disabled = false;
        return showLoseModal(false, data.error);
      }

      marker.style.left = data.roll + '%';

      setTimeout(() => {
        STATE.balance = data.newBalance;
        updateUI();
        upgradeState.playing = false;
        document.getElementById('upgradeBtn').disabled = false;
        document.getElementById('upg-betMinus').disabled = false;
        document.getElementById('upg-betPlus').disabled = false;
        document.getElementById('upg-betInput').disabled = false;

        if (data.isWin) {
          SOUNDS.win();
          showWinModal(data.winAmount, '⭐', 'УСПЕШНЫЙ АПГРЕЙД!');
        } else {
          SOUNDS.lose();
          showLoseModal(true, `Маркер остановился на ${data.roll.toFixed(2)}. Вы проиграли.`);
        }
      }, 2500); 

    } catch (e) {
      upgradeState.playing = false;
      document.getElementById('upgradeBtn').disabled = false;
      document.getElementById('upg-betMinus').disabled = false;
      document.getElementById('upg-betPlus').disabled = false;
      document.getElementById('upg-betInput').disabled = false;
      showLoseModal(false, 'Ошибка сервера.');
    }
  }, 50);
}

/* ================= МОДАЛКИ ================= */
function closeModal() { document.getElementById('modalMask').classList.remove('show'); document.getElementById('modalContent').innerHTML = ''; setTimeout(() => { document.getElementById('modalBtn').style.display = 'block'; }, 300); }
function showWinModal(amount, currency, title) {
  const modal = document.getElementById('modalBox');
  modal.className = 'modal win';
  document.getElementById('modalIcon').innerHTML = `<div class="icon-win"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').innerHTML = `Вы заработали:<br><span class="win-amount">${formatMoney(amount)} <img src="https://i.ibb.co/mCMTLBfh/image.png" class="star-icon-large" alt="star"></span>`;
  const btn = document.getElementById('modalBtn');
  btn.className = 'modal-btn green'; btn.textContent = 'Забрать'; btn.style.display = 'block';
  document.getElementById('modalMask').classList.add('show');
}
function showLoseModal(isGame, text) {
  const modal = document.getElementById('modalBox');
  modal.className = 'modal lose';
  document.getElementById('modalIcon').innerHTML = `<div class="icon-lose"><svg viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path><path d="M8 15s1.5-2 4-2 4 2 4 2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg></div>`;
  document.getElementById('modalTitle').textContent = isGame ? 'Не повезло...' : 'Внимание';
  document.getElementById('modalText').textContent = text;
  const btn = document.getElementById('modalBtn');
  btn.className = 'modal-btn purple'; btn.textContent = 'Продолжить'; btn.style.display = 'block';
  document.getElementById('modalMask').classList.add('show');
}

function openDepositModal() {
  const modal = document.getElementById('modalBox');
  modal.className = 'modal win';
  document.getElementById('modalIcon').innerHTML = '<div class="icon-win">💎</div>';
  document.getElementById('modalTitle').textContent = 'Пополнение';
  document.getElementById('modalText').innerHTML = 'Введите сумму в звездах:';
  const content = document.getElementById('modalContent');
  content.innerHTML = `<div class="input-group"><input type="number" id="depositAmountInput" placeholder="Мин. 10" min="10"></div><button class="main-action-btn" style="margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 6px;" onclick="processStarsPayment()">Оплатить <img src="https://i.ibb.co/mCMTLBfh/image.png" class="star-icon" alt="star"></button>`;
  document.getElementById('modalBtn').style.display = 'none';
  document.getElementById('modalMask').classList.add('show');
}

async function processStarsPayment() {
  const amount = parseInt(document.getElementById('depositAmountInput').value);
  if (!amount || amount < 10) return showToast('Минимальная сумма пополнения 10');
  closeModal();
  document.getElementById('loader').classList.add('show');
  try {
    const response = await fetch(`${API_URL}/pay`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: STATE.userId, amount: amount }) });
    const textData = await response.text(); 
    let data;
    try { data = JSON.parse(textData); } catch(e) { return showLoseModal(false, `Ошибка сервера`); }
    
    if (data.success && data.invoiceLink) {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.openInvoice(data.invoiceLink, (status) => {
          document.getElementById('loader').classList.remove('show');
          if (status === 'paid') { showToast('Оплата прошла!'); setTimeout(() => window.location.reload(), 2000); } else showToast('Оплата отменена.');
        });
      } else { document.getElementById('loader').classList.remove('show'); window.open(data.invoiceLink, '_blank'); }
    } else { document.getElementById('loader').classList.remove('show'); showLoseModal(false, 'Ответ: ' + JSON.stringify(data)); }
  } catch (e) { document.getElementById('loader').classList.remove('show'); showLoseModal(false, 'ОШИБКА СЕТИ: ' + e.message); }
}

function openWithdrawModal() {
  const modal = document.getElementById('modalBox');
  modal.className = 'modal win';
  document.getElementById('modalIcon').innerHTML = '<div class="icon-win">💸</div>';
  document.getElementById('modalTitle').textContent = 'Вывод средств';
  document.getElementById('modalText').innerHTML = 'Заявка будет отправлена администратору для ручной выплаты:';
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="input-group"><label>Сумма (Мин. 100 ⭐)</label><input type="number" id="withdrawAmountInput" placeholder="100" min="100"></div>
    <div class="input-group"><label>Ваш Telegram (для перевода)</label><input type="text" id="withdrawUsernameInput" placeholder="@username"></div>
    <div style="background: rgba(251, 113, 133, 0.1); border: 1px solid rgba(251, 113, 133, 0.3); padding: 12px; border-radius: 12px; margin-top: 15px; text-align: left;"><p style="color: var(--red); font-size: 12px; font-weight: 700; margin: 0;">⚠️ Внимание: Убедитесь, что ваш ник написан верно. Изменить его после отправки заявки будет невозможно!</p></div>
    <button class="main-action-btn" style="margin-top: 20px;" onclick="submitWithdraw()">Отправить заявку</button>
  `;
  document.getElementById('modalBtn').style.display = 'none';
  document.getElementById('modalMask').classList.add('show');
}

async function submitWithdraw() {
  const amount = parseInt(document.getElementById('withdrawAmountInput').value);
  const username = document.getElementById('withdrawUsernameInput').value.trim();
  if (!amount || amount < 100) return showToast('Минимальная сумма вывода 100 ⭐');
  if (!username || username.length < 3) return showToast('Введите ваш Telegram ник!');
  if (amount > STATE.balance) return showToast('Недостаточно средств!');
  closeModal();
  document.getElementById('loader').classList.add('show');
  try {
    const response = await fetch(`${API_URL}/withdraw`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: STATE.userId, amount: amount, tgUsername: username }) });
    const textData = await response.text(); 
    let data;
    try { data = JSON.parse(textData); } catch(e) { document.getElementById('loader').classList.remove('show'); return showLoseModal(false, 'Ошибка сервера: ' + textData.substring(0, 50)); }
    document.getElementById('loader').classList.remove('show');
    if (data.success) {
      STATE.balance = data.newBalance;
      updateUI();
      const modal = document.getElementById('modalBox');
      modal.className = 'modal win';
      document.getElementById('modalIcon').innerHTML = `<div class="icon-win"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
      document.getElementById('modalTitle').textContent = 'Заявка отправлена!';
      document.getElementById('modalText').innerHTML = 'Администратор свяжется с вами и переведет звезды.';
      document.getElementById('modalContent').innerHTML = ''; 
      const btn = document.getElementById('modalBtn');
      btn.className = 'modal-btn green'; btn.textContent = 'Отлично'; btn.style.display = 'block';
      document.getElementById('modalMask').classList.add('show');
    } else { showLoseModal(false, data.error || 'Ошибка при выводе.'); }
  } catch (e) { document.getElementById('loader').classList.remove('show'); showLoseModal(false, 'Ошибка: ' + e.message); }
}

if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready(); Telegram.WebApp.expand();
  setTimeout(() => { initUserData(); setSlotMode('easy'); }, 100);
} else {
  initUserData(); setSlotMode('easy'); 
}
</script>
</body>
