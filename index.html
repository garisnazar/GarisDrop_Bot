<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GarisDrop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyCgrphceMHytjNPu0FMH4ZQAyykOHnnwt8", authDomain: "garisdrop.firebaseapp.com", projectId: "garisdrop", storageBucket: "garisdrop.firebasestorage.app", messagingSenderId: "1091919506726", appId: "1:1091919506726:web:9f18f735c125d0324da5e7" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db; window.doc = doc; window.getDoc = getDoc; window.setDoc = setDoc;
</script>
<style>
  body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
  .debug-box { background: #222; border: 1px solid #0f0; padding: 15px; margin-top: 20px; border-radius: 10px; text-align: left; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
  <h1>Тест Базы Данных</h1>
  <div id="result" class="debug-box">Загрузка...</div>

<script>
  async function testFirebase() {
    const resDiv = document.getElementById('result');
    let debugText = "";

    try {
      // 1. Получаем Telegram ID
      let tgId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
      debugText += `Telegram ID: ${tgId ? tgId : "НЕ НАЙДЕН"}<br><br>`;

      if (!tgId) {
        resDiv.innerHTML = debugText + "ОШИБКА: Сайт не видит Telegram. Открой через бота!";
        return;
      }

      // 2. Ищем в базе
      const userId = String(tgId);
      const userDocRef = window.doc(window.db, "users", userId);
      const docSnap = await window.getDoc(userDocRef);

      if (docSnap.exists()) {
        const data = docSnap.data();
        debugText += `Документ найден в базе!<br>`;
        debugText += `Баланс: ${data.balance}<br>`;
        debugText += `Секретный ключ: ${data.serverKey ? "ЕСТЬ" : "НЕТ"}<br><br>`;
        resDiv.innerHTML = debugText + "<b>ВСЁ РАБОТАЕТ!</b> Если баланс тут есть, а в игре нет — значит игра не обновилась.";
      } else {
        debugText += `Документ с ID ${userId} НЕ НАЙДЕН в базе.`;
        resDiv.innerHTML = debugText;
      }
    } catch (e) {
      resDiv.innerHTML = debugText + "ОШИБКА FIREBASE: " + e.message;
    }
  }
  setTimeout(testFirebase, 1000);
</script>
</body>
</html>
